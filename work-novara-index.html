<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novara — wellness и SPA на Алтае</title>
  <meta name="description" content="Novara — wellness и SPA на Алтае, открыто круглосуточно: массаж, хаммам, сауна, уход за лицом, программы и ретриты.">
  <link rel="icon" href="work-novara-img-logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="work-novara-css-style.css?v=14">
</head>
<body data-page="home" data-title="meta.home">
  <div id="header"></div>

  <main>
    <!-- Первый экран: знак рисуется линией -->
    <section class="hero">
      <img src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=2000&q=80" alt="">
      <div class="hero__in">
        <h1>
          <span data-mark="mark--draw"></span>
          <span class="hero__word fade-late" style="display:block">NOVARA</span>
        </h1>
        <p class="hero__line fade-late" data-i18n="home.hero.line"></p>
        <div class="btn-row fade-late">
          <a class="btn btn--wood" data-wa><span data-i18n="btn.whatsapp"></span></a>
          <a class="btn btn--ghost-light" data-tg><span data-i18n="btn.telegram"></span></a>
        </div>
      </div>
    </section>

    <!-- Что это за место -->
    <section class="block">
      <div class="wrap intro">
        <div>
          <h2 class="h2" data-i18n="home.intro.title"></h2>
          <p class="text text--lead" data-i18n="home.intro.p1"></p>
          <p class="text" data-i18n="home.intro.p2"></p>
        </div>
        <div class="intro__media">
          <img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?auto=format&fit=crop&w=1200&q=80" alt="" loading="lazy">
        </div>
      </div>
    </section>

    <!-- Услуги -->
    <section class="block block--white">
      <div class="wrap">
        <div class="block__head"><h2 class="h2" data-i18n="home.srv.title"></h2></div>
        <div class="tiles">
          <a class="tile" href="work-novara-services.html#massage">
            <img src="https://images.unsplash.com/photo-1696841212541-449ca29397cc?auto=format&fit=crop&w=1000&q=80" alt="" loading="lazy">
            <h3 class="h3" data-i18n="dir.massage"></h3>
            <p class="text" data-i18n="dir.massage.d"></p>
            <span class="tile__link" data-i18n="home.srv.link"></span>
          </a>
          <a class="tile" href="work-novara-services.html#thermal">
            <img src="https://images.unsplash.com/photo-1770625468009-791d7c5391f9?auto=format&fit=crop&w=1000&q=80" alt="" loading="lazy">
            <h3 class="h3" data-i18n="dir.thermal"></h3>
            <p class="text" data-i18n="dir.thermal.d"></p>
            <span class="tile__link" data-i18n="home.srv.link"></span>
          </a>
          <a class="tile" href="work-novara-services.html#face">
            <img src="https://images.unsplash.com/photo-1598901986949-f593ff2a31a6?auto=format&fit=crop&w=1000&q=80" alt="" loading="lazy">
            <h3 class="h3" data-i18n="dir.face"></h3>
            <p class="text" data-i18n="dir.face.d"></p>
            <span class="tile__link" data-i18n="home.srv.link"></span>
          </a>
          <a class="tile" href="work-novara-services.html#programs">
            <img src="https://images.unsplash.com/photo-1532798442725-41036acc7489?auto=format&fit=crop&w=1000&q=80" alt="" loading="lazy">
            <h3 class="h3" data-i18n="dir.programs"></h3>
            <p class="text" data-i18n="dir.programs.d"></p>
            <span class="tile__link" data-i18n="home.srv.link"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- Открыто 24/7 — вертикальные флаги как в референсе -->
    <section class="block block--glow">
      <div class="wrap open">
        <div class="flag flag--pine" aria-hidden="true"><span class="flag__word">NOVARA</span><span data-mark></span></div>
        <div class="flag flag--stone" aria-hidden="true"><span class="flag__word">NOVARA</span><span data-mark></span></div>
        <div class="open__body">
          <h2 class="h2" data-i18n="home.open.title"></h2>
          <p class="text text--lead" data-i18n="home.open.p"></p>
        </div>
      </div>
    </section>

    <!-- Как записаться -->
    <section class="block block--pine">
      <div class="wrap">
        <div class="block__head"><h2 class="h2" data-i18n="home.steps.title"></h2></div>
        <ol class="steps">
          <li><h3 class="h3" data-i18n="step1"></h3><p class="text" data-i18n="step1.d"></p></li>
          <li><h3 class="h3" data-i18n="step2"></h3><p class="text" data-i18n="step2.d"></p></li>
          <li><h3 class="h3" data-i18n="step3"></h3><p class="text" data-i18n="step3.d"></p></li>
        </ol>
        <div class="btn-row">
          <a class="btn btn--wood" data-wa><span data-i18n="btn.whatsapp"></span></a>
          <a class="btn btn--ghost-light" data-tg><span data-i18n="btn.telegram"></span></a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="work-novara-js-i18n.js?v=14"></script>
  <script src="work-novara-js-main.js?v=14"></script>
</body>
</html>
